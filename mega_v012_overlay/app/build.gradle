plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mega.virtualai'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mega.virtualai'
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName '0.12'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
