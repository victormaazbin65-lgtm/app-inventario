name: Build MEGA v0.05
on:
  push:
    branches:
      - mega-apk-v004-temp
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Extract MEGA v0.04 base
        run: |
          cat mega_v004/chunk_* > source.b64
          base64 -d source.b64 > mega.zip
          unzip -q mega.zip

      - name: Apply MEGA v0.05 brain and UI
        run: |
          cp mega_patch_v005/MainActivity.java MEGA_v0.01/app/src/main/java/com/mega/pet/MainActivity.java
          cp mega_patch_v005/MegaPrefs.java MEGA_v0.01/app/src/main/java/com/mega/pet/MegaPrefs.java
          cp mega_patch_v005/LearnedSkills.java MEGA_v0.01/app/src/main/java/com/mega/pet/LearnedSkills.java
          cp mega_patch_v005/AndroidManifest.xml MEGA_v0.01/app/src/main/AndroidManifest.xml
          cp mega_patch_v005/app_build.gradle MEGA_v0.01/app/build.gradle
          python3 mega_patch_v005/patch_v005.py

      - name: Build unsigned release
        working-directory: MEGA_v0.01
        run: gradle assembleRelease --no-daemon

      - name: Package build and signing tools
        run: |
          cp MEGA_v0.01/app/build/outputs/apk/release/app-release-unsigned.apk MEGA-v0.05-unsigned.apk
          mkdir -p signtools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" signtools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signtools/lib/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MEGA-v0.05-build
          path: |
            MEGA-v0.05-unsigned.apk
            signtools/
