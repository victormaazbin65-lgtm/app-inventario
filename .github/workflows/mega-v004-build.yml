name: Build MEGA v0.06
on:
  push:
    branches:
      - mega-apk-v004-temp
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Extract and fix MEGA v0.06 source
        run: |
          cat mega_v006_chunks/chunk_* > source.b64
          base64 -d source.b64 > mega.zip
          unzip -q mega.zip
          python - <<'PY'
          from pathlib import Path
          p=Path('MEGA_v0.01/app/src/main/java/com/mega/pet/MainActivity.java')
          s=p.read_text()
          if 'import android.view.inputmethod.InputMethodManager;' not in s:
              s=s.replace('import android.view.*;', 'import android.view.*;\nimport android.view.inputmethod.InputMethodManager;')
          p.write_text(s)
          p=Path('MEGA_v0.01/app/src/main/java/com/mega/pet/MegaBrain.java')
          s=p.read_text()
          old='''        request(c, prompt, (ok, text) -> {\n            if (!ok || text == null || text.trim().equalsIgnoreCase("[SILENCIO]")) return;\n            cb.done(true, text);\n        });'''
          new='''        request(c, prompt, (ok, text) -> {\n            if (!ok || text == null || text.trim().equalsIgnoreCase("[SILENCIO]")) return;\n            cb.done(true, text);\n        }, false);'''
          s=s.replace(old,new)
          p.write_text(s)
          PY

      - name: Build unsigned release
        working-directory: MEGA_v0.01
        run: gradle assembleRelease --no-daemon

      - name: Package build and signing tools
        run: |
          cp MEGA_v0.01/app/build/outputs/apk/release/app-release-unsigned.apk MEGA-v0.06-unsigned.apk
          mkdir -p signtools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" signtools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signtools/lib/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MEGA-v0.06-build
          path: |
            MEGA-v0.06-unsigned.apk
            signtools/
