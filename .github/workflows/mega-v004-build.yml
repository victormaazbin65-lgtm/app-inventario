name: Build MEGA v0.11 Fresh
on:
  push:
    branches:
      - mega-apk-v004-temp
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Reconstruct MEGA source
        run: |
          cat mega_v006_chunks/chunk_* > source.b64
          base64 -d source.b64 > mega.zip
          unzip -q mega.zip
          for v in mega_v007_patch_chunks mega_v008_patch_chunks mega_v008_hotfix_chunks mega_v009_patch_chunks; do
            cat "$v"/chunk_* > one.b64
            base64 -d one.b64 > one.tar.xz
            tar -xJf one.tar.xz -C MEGA_v0.01
          done

      - name: Apply v0.10 crash fix and create fresh package v0.11
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil

          root = Path('MEGA_v0.01')
          manifest = root / 'app/src/main/AndroidManifest.xml'
          text = manifest.read_text()
          if 'android.permission.ACCESS_NETWORK_STATE' not in text:
              text = text.replace(
                  '<uses-permission android:name="android.permission.INTERNET" />',
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />'
              )
          manifest.write_text(text)

          gradle = root / 'app/build.gradle'
          text = gradle.read_text()
          text = text.replace("namespace 'com.mega.pet'", "namespace 'com.mega.virtualai'")
          text = text.replace("applicationId 'com.mega.pet'", "applicationId 'com.mega.virtualai'")
          text = re.sub(r'versionCode\s+\d+', 'versionCode 11', text, count=1)
          text = re.sub(r"versionName\s+'[^']+'", "versionName '0.11'", text, count=1)
          gradle.write_text(text)

          old = root / 'app/src/main/java/com/mega/pet'
          new = root / 'app/src/main/java/com/mega/virtualai'
          new.parent.mkdir(parents=True, exist_ok=True)
          if new.exists(): shutil.rmtree(new)
          old.rename(new)
          for p in new.rglob('*.java'):
              s = p.read_text().replace('package com.mega.pet;', 'package com.mega.virtualai;').replace('com.mega.pet.', 'com.mega.virtualai.')
              p.write_text(s)

          main = new / 'MainActivity.java'
          text = main.read_text()
          pattern = r'    private boolean hasInternet\(\) \{.*?^    \}\n\n    private String connectivityLine\(\) \{'
          replacement = '''    private boolean hasInternet() {
              try {
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);
                  if (cm == null) return false;
                  Network n = cm.getActiveNetwork();
                  if (n == null) return false;
                  NetworkCapabilities caps = cm.getNetworkCapabilities(n);
                  if (caps == null) return false;
                  return caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                          && (caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)
                          || caps.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR)
                          || caps.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET));
              } catch (RuntimeException e) {
                  return false;
              }
          }

          private String connectivityLine() {'''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S | re.M)
          if count != 1:
              raise SystemExit('Could not patch hasInternet()')
          main.write_text(text)
          PY
          grep -q "applicationId 'com.mega.virtualai'" MEGA_v0.01/app/build.gradle
          grep -q "versionName '0.11'" MEGA_v0.01/app/build.gradle
          grep -q "ACCESS_NETWORK_STATE" MEGA_v0.01/app/src/main/AndroidManifest.xml
          grep -q "package com.mega.virtualai;" MEGA_v0.01/app/src/main/java/com/mega/virtualai/MainActivity.java

      - name: Build unsigned release
        working-directory: MEGA_v0.01
        run: gradle assembleRelease --no-daemon

      - name: Package build and signing tools
        run: |
          cp MEGA_v0.01/app/build/outputs/apk/release/app-release-unsigned.apk MEGA-v0.11-fresh-unsigned.apk
          mkdir -p signtools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" signtools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signtools/lib/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MEGA-v0.11-fresh-build
          path: |
            MEGA-v0.11-fresh-unsigned.apk
            signtools/
