name: Test MEGA v0.09 startup
on:
  push:
    branches:
      - mega-apk-v004-temp
jobs:
  smoke:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Reconstruct current source
        run: |
          cat mega_v006_chunks/chunk_* > source.b64
          python3 -c "import base64;open('mega.zip','wb').write(base64.b64decode(open('source.b64','rb').read()))"
          unzip -q mega.zip
          for v in mega_v007_patch_chunks mega_v008_patch_chunks mega_v008_hotfix_chunks mega_v009_patch_chunks; do
            cat "$v"/chunk_* > one.b64
            python3 -c "import base64;open('one.tar.xz','wb').write(base64.b64decode(open('one.b64','rb').read()))"
            tar -xJf one.tar.xz -C MEGA_v0.01
          done
          grep -q "SafeLauncherActivity" MEGA_v0.01/app/src/main/AndroidManifest.xml
          grep -q "versionName '0.09'" MEGA_v0.01/app/build.gradle

      - name: Launch safe and full modes without permissions
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          script: |
            gradle -p MEGA_v0.01 assembleDebug --no-daemon
            adb install -r MEGA_v0.01/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c

            echo "=== SAFE LAUNCHER ==="
            adb shell am start -W -n com.mega.pet/.SafeLauncherActivity
            sleep 4
            PID=$(adb shell pidof com.mega.pet | tr -d '\r')
            echo "MEGA safe PID=$PID"
            if [ -z "$PID" ]; then
              echo "=== LOGCAT AFTER SAFE LAUNCH FAILED ==="
              adb logcat -d | tail -700
              echo "=== ACTIVITY STATE ==="
              adb shell dumpsys activity activities | tail -250 || true
              exit 1
            fi
            adb shell dumpsys activity activities | grep -m1 "mResumedActivity" || true
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then
              adb logcat -d | grep -A 140 -B 30 "FATAL EXCEPTION"
              exit 1
            fi

            echo "=== FULL MEGA VIA SAFE LAUNCHER ==="
            adb shell am force-stop com.mega.pet
            adb logcat -c
            adb shell am start -W -n com.mega.pet/.SafeLauncherActivity --ez test_full true
            sleep 10
            PID=$(adb shell pidof com.mega.pet | tr -d '\r')
            echo "MEGA full PID=$PID"
            if [ -z "$PID" ]; then
              echo "=== LOGCAT AFTER FULL LAUNCH FAILED ==="
              adb logcat -d | tail -1000
              exit 1
            fi
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then
              adb logcat -d | grep -A 180 -B 40 "FATAL EXCEPTION"
              exit 1
            fi
            echo "MEGA safe launcher and full activity stayed alive"
