name: Test MEGA v0.12 startup
on:
  push:
    branches:
      - mega-apk-v004-temp
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Reconstruct MEGA v0.12 source
        run: |
          cat mega_v006_chunks/chunk_* > source.b64
          base64 -d source.b64 > mega.zip
          unzip -q mega.zip
          for v in mega_v007_patch_chunks mega_v008_patch_chunks mega_v008_hotfix_chunks mega_v009_patch_chunks; do
            cat "$v"/chunk_* > one.b64
            base64 -d one.b64 > one.tar.xz
            tar -xJf one.tar.xz -C MEGA_v0.01
          done
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          root = Path('MEGA_v0.01')
          manifest = root / 'app/src/main/AndroidManifest.xml'
          text = manifest.read_text()
          if 'android.permission.ACCESS_NETWORK_STATE' not in text:
              text = text.replace('<uses-permission android:name="android.permission.INTERNET" />', '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />')
          manifest.write_text(text)
          gradle = root / 'app/build.gradle'
          text = gradle.read_text().replace("namespace 'com.mega.pet'", "namespace 'com.mega.virtualai'").replace("applicationId 'com.mega.pet'", "applicationId 'com.mega.virtualai'")
          gradle.write_text(text)
          old = root / 'app/src/main/java/com/mega/pet'
          new = root / 'app/src/main/java/com/mega/virtualai'
          new.parent.mkdir(parents=True, exist_ok=True)
          if new.exists(): shutil.rmtree(new)
          old.rename(new)
          for p in new.rglob('*.java'):
              p.write_text(p.read_text().replace('package com.mega.pet;', 'package com.mega.virtualai;').replace('com.mega.pet.', 'com.mega.virtualai.'))
          main = new / 'MainActivity.java'
          text = main.read_text()
          pattern = r'    private boolean hasInternet\(\) \{.*?^    \}\n\n    private String connectivityLine\(\) \{'
          replacement = '''    private boolean hasInternet() {
              try {
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(CONNECTIVITY_SERVICE);
                  if (cm == null) return false;
                  Network n = cm.getActiveNetwork();
                  if (n == null) return false;
                  NetworkCapabilities caps = cm.getNetworkCapabilities(n);
                  if (caps == null) return false;
                  return caps.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                          && (caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI)
                          || caps.hasTransport(NetworkCapabilities.TRANSPORT_CELLULAR)
                          || caps.hasTransport(NetworkCapabilities.TRANSPORT_ETHERNET));
              } catch (RuntimeException e) {
                  return false;
              }
          }

          private String connectivityLine() {'''
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S | re.M)
          if count != 1: raise SystemExit('Could not patch hasInternet()')
          main.write_text(text)
          PY
          cp mega_v012_overlay/app/build.gradle MEGA_v0.01/app/build.gradle
          cp mega_v012_overlay/app/src/main/java/com/mega/virtualai/MainActivity.java MEGA_v0.01/app/src/main/java/com/mega/virtualai/MainActivity.java
          cp mega_v012_overlay/app/src/main/java/com/mega/virtualai/MegaPrefs.java MEGA_v0.01/app/src/main/java/com/mega/virtualai/MegaPrefs.java
          cp mega_v012_overlay/app/src/main/java/com/mega/virtualai/MegaBrain.java MEGA_v0.01/app/src/main/java/com/mega/virtualai/MegaBrain.java
          cp mega_v012_overlay/app/src/main/java/com/mega/virtualai/Mega3DView.java MEGA_v0.01/app/src/main/java/com/mega/virtualai/Mega3DView.java
          cp mega_v012_overlay/app/src/main/java/com/mega/virtualai/MegaRobotView.java MEGA_v0.01/app/src/main/java/com/mega/virtualai/MegaRobotView.java
          cp mega_v012_overlay/app/src/main/java/com/mega/virtualai/MegaNotifier.java MEGA_v0.01/app/src/main/java/com/mega/virtualai/MegaNotifier.java
          grep -q "versionName '0.12'" MEGA_v0.01/app/build.gradle
          grep -q "SafeLauncherActivity" MEGA_v0.01/app/src/main/AndroidManifest.xml

      - name: Launch safe and full v0.12 without permissions
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            gradle -p MEGA_v0.01 assembleDebug --no-daemon
            adb install -r MEGA_v0.01/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.mega.virtualai/com.mega.virtualai.SafeLauncherActivity
            sleep 4
            PID=$(adb shell pidof com.mega.virtualai | tr -d '\r')
            echo "MEGA safe PID=$PID"
            if [ -z "$PID" ]; then adb logcat -d | tail -700; exit 1; fi
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then adb logcat -d | grep -A 160 -B 40 "FATAL EXCEPTION"; exit 1; fi
            adb shell am force-stop com.mega.virtualai
            adb logcat -c
            adb shell am start -W -n com.mega.virtualai/com.mega.virtualai.SafeLauncherActivity --ez test_full true
            sleep 12
            PID=$(adb shell pidof com.mega.virtualai | tr -d '\r')
            echo "MEGA full PID=$PID"
            if [ -z "$PID" ]; then adb logcat -d | tail -1000; exit 1; fi
            if adb logcat -d | grep -q "FATAL EXCEPTION"; then adb logcat -d | grep -A 180 -B 40 "FATAL EXCEPTION"; exit 1; fi
            echo "MEGA v0.12 startup passed"
