plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mega.pet'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mega.pet'
        minSdk 26
        targetSdk 36
        versionCode 5
        versionName '0.05'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
